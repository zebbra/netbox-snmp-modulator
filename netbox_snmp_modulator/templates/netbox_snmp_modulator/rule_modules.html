{% for x in m.add %}<div><span class="badge text-bg-success" title="add: always set">{{ x }}</span></div>{% endfor %}{% for x in m.try %}<div><span class="badge bg-primary-subtle text-primary-emphasis border border-primary-subtle" title="try: set if the device returns data">{{ x }}</span></div>{% endfor %}{% for x in m.block %}<div><span class="badge text-bg-danger text-decoration-line-through" title="block: never set">{{ x }}</span></div>{% endfor %}{% for x in remove %}<div><span class="badge bg-danger-subtle text-danger-emphasis border border-danger-subtle" title="would remove: on the device now, no rule gives it">{{ x }}</span></div>{% endfor %}
